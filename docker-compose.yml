version: '3.9'

services:
  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: music_recommend_clickhouse
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./app/db/clickhouse_schemas.sql:/docker-entrypoint-initdb.d/init.sql
      - ./clickhouse-config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    environment:
      CLICKHOUSE_DB: music_recommend
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - music_recommend_network

  # Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: music_recommend_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - music_recommend_network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: music_recommend_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - music_recommend_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: music_recommend_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - music_recommend_network

  # FastAPI приложение
  api:
    build: .
    container_name: music_recommend_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-music_recommend}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-user_track_events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-recommend_consumer}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_RELOAD: ${API_RELOAD:-True}
      MIN_INTERACTIONS_FOR_RECOMMENDATIONS: ${MIN_INTERACTIONS_FOR_RECOMMENDATIONS:-5}
      TOP_N_RECOMMENDATIONS: ${TOP_N_RECOMMENDATIONS:-10}
    depends_on:
      - clickhouse
      - kafka
      - redis
    volumes:
      - .:/app
    networks:
      - music_recommend_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  clickhouse_data:
  redis_data:

networks:
  music_recommend_network:
    driver: bridge

