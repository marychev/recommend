[pytest]
# Конфигурация для pytest с поддержкой asyncio

# Минимальная версия pytest
minversion = 7.0

# Директория с тестами
testpaths = tests

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Метки для тестов
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test
    unit: mark test as unit test

# Настройки для asyncio
asyncio_mode = auto

# Опции отображения
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Переменные окружения для тестов (требуется pytest-env)
env =
    CLICKHOUSE_PORT=8123
    CLICKHOUSE_HOST=localhost

# Покрытие кода (если используется pytest-cov)
# --cov=app
# --cov-report=html
# --cov-report=term-missing

# Игнорировать предупреждения
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

